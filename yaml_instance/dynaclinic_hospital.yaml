version: 0.0.0
# ponytail: duplicated graph, drift accepted, both are MVPs
graph:
  id: dynaclinic_hospital
  description: |
    Hospital simulation with a DynaClinic consult per day, derived from demo_hospital.
    Each day: PatientDataGenerator admits one patient as a symptom-level presentation (no diagnosis),
    the inlined DynaClinic consult (dc_triage..dc_safety_gate, kept in sync by hand with
    yaml_instance/dynaclinic_mvp.yaml) runs on that presentation (open-ended case: mode, C/U,
    assessment and plan, safety gates), then the triage queue is generated and reported as in
    demo_hospital. DailySummary writes patient, DynaClinic mode, leading diagnosis, plan and triage
    status to memory; LoopGate (loop_counter, 2 days) loops back, and FinalReport lists every day's
    consult from memory. Research prototype on synthetic patients; not clinical advice.
  log_level: INFO
  is_majority_voting: false
  nodes:
    - id: DayStart
      type: literal
      config:
        content: Starting hospital operations
        role: user
      description: Triggers the start of each hospital day
      context_window: 0
      log_output: true
    - id: PatientDataGenerator
      type: agent
      config:
        name: ${MODEL_NAME}
        provider: openai
        role: |
          You are the admissions desk of a simulated hospital. Generate ONE newly admitted patient as the
          presentation the attending team receives. Output ONLY valid JSON with exactly these keys:
          {
            "patient_name": "<full name>",
            "age": <integer>,
            "sex": "<female or male>",
            "chief_complaint": "<main symptom with its duration>",
            "history_of_present_illness": "<2-4 sentences: onset, course, associated and pertinent negative symptoms>",
            "vitals": "<BP, HR, RR, temperature, SpO2>",
            "history": ["<past medical or surgical history item>"],
            "medications": ["<drug and dose>"],
            "allergies": ["<drug allergy and reaction, or none>"],
            "exam": "<key examination findings>",
            "labs": ["<test value unit>"],
            "imaging": ["<study: findings described without a diagnosis, or leave the list empty>"]
          }
          Never state, name or hint at a diagnosis, a working impression or a disease name anywhere: describe only
          symptoms, signs, history and raw results, so that the attending team has to work the diagnosis out.
          Vary the cases: if the message includes "Environment: case_mix_context=flu_surge", bias
          the chief complaint toward respiratory infection; otherwise pick the organ system from the
          day number in the request (day 1 abdominal, day 2 respiratory, day 3 cardiovascular, day 4
          neurological, day 5 renal or metabolic, day 6 infectious, then repeat). Vary age, sex and
          acuity either way.
        base_url: ${OPENAI_BASE_URL}
        api_key: ${OPENAI_API_KEY}
        params: {}
        tooling: null
        thinking: null
        memories: []
        retry: null
      description: Generates the day's admission as a presentation without a diagnosis
      context_window: 0
      log_output: true
    - id: Triage
      type: dc_triage
      description: >-
        Meta-Controller (complexity), Complexity C. Ingests the case (FHIR-lite stub), asks the LLM for a complexity
        tier, scores the case deterministically, bumps an LLM LOW to MODERATE when the score reaches
        escalate_threshold (safety bias), and emits ROUTE: LOW|MODERATE|HIGH. C = max(tier level, feature
        density), with tau_c 0.5 equivalent to the tier rule.
      config: {}
    - id: GeneralistSweep
      type: dc_uncertainty
      description: >-
        Meta-Controller (uncertainty), Uncertainty U and mode rule. One generalist call lists a probability-weighted
        differential (top-k, or one entry per option); U is its normalised entropy. Emits
        MODE: HIERARCHICAL|COLLABORATIVE|ADVERSARIAL. tau_u per input form and per model: the model's
        calibrated row (75th percentile of U, python -m dynaclinic.eval.calibrate); a model without one
        falls back to gpt-6-luna's 0.15 multiple choice / 0.59 open-ended with a warning. Calibrated, not
        validated against outcomes. Set tau_u_mcq / tau_u_open (or tau_u for both) to pin a value.
      config:
        k: 5
    - id: PrimaryCare
      type: dc_primary_care
      description: >-
        Primary Care Agent, the hierarchical mode hub, restricted to the Emanuel & Emanuel Informative model;
        it may consult up to two specialist spokes (CONSULT: <role>: <question>), each answering only its
        own question from its own slice, then answers:
        facts and risks of each option, ending in FINAL ANSWER: <letter>; for an open-ended case a
        write-up (ASSESSMENT, DIFFERENTIAL, PLAN, RED FLAGS / ESCALATE IF, MISSING INFORMATION) ending
        in RECOMMENDATION:.
      config: {}
    - id: CareTeam
      type: dc_care_team
      description: >-
        Collaborative/adversarial modes. Integrated Care Team (Imaging, Pathology/Lab, Pharmacology; two of
        them for a LOW or MODERATE tier) writes findings, an answer distribution and claims to the shared Blackboard; for
        an open-ended case a LEADING DIAGNOSIS (or ABSTAIN) and a DOMAIN RECOMMENDATION instead of a
        distribution. context_policy shared_core: each specialist reads the case summary,
        then its own modality slice; strict: its modality slice only.
      config:
        context_policy: shared_core
    - id: DivergenceGate
      type: dc_divergence_gate
      description: >-
        Conflict-aware switch. Multiple choice: MODE: ADVERSARIAL when the specialists' top-1 answers
        disagree or their mean pairwise Jensen-Shannon divergence reaches tau. Open-ended case: when
        the mean pairwise cosine distance between their leading diagnoses (text-embedding-3-small,
        hashing fallback) reaches tau_semantic (unset: the embedder's default), or fewer than two
        specialists asserted anything. Else MODE: COLLABORATIVE. Adversarial mode entered by
        uncertainty stays ADVERSARIAL; the divergence is only reported. No LLM call.
      config:
        tau: 0.25
    - id: MeshExchange
      type: dc_mesh_exchange
      description: >-
        Collaborative mode, after the Conflict Detector compared the independent round-1 hypotheses.
        Fully connected mesh: each care-team specialist reads every peer's round-1 entry (findings,
        claims, distribution or leading diagnosis), states what it adopts or disputes from each, and
        posts a revised step-2 entry to the Blackboard, concurrently. A failed reply leaves that
        specialist's round-1 entry standing. Not a 3D character (the specialists are the Care Team's).
      config: {}
    - id: Proponent
      type: dc_proponent
      description: >-
        Proponent, adversarial mode, before the Critic. H1 is the team's plurality hypothesis (option letter, or
        leading diagnosis for an open-ended case); on a tie, the generalist sweep's top differential.
        H2 is the strongest alternative: the dissenting specialist's hypothesis, else the sweep's next
        differential. The Proponent argues H1 from the case and the Blackboard, states what would
        falsify it and why H1 beats H2. Nothing to debate or a failed call: classic Critic review.
      config: {}
    - id: Critic
      type: dc_critic
      description: >-
        Clinical Critic (Opponent), adversarial mode. Decomposes the Blackboard into atomic claims, scores them
        with the hybrid rule/LLM-judge estimator and flags unsupported claims for the Synthesizer. In
        the same call it is the Opponent: it reads H1, H2 and the Proponent's case and lists
        counterevidence against both (logical leaps, contradicting findings or trial evidence,
        contraindications for this patient).
      config: {}
    - id: Synthesizer
      type: dc_synthesizer
      description: >-
        Consensus Builder / Mediator. Consensus Builder in collaborative mode, integrating the round-1 and mesh step-2 entries into one
        unified differential; Mediator (Conflict Resolver) in adversarial mode, where it reads the
        debate transcript and the Critic's flagged claims and first states SURVIVING HYPOTHESIS:
        H1|H2|neither and why. Writes the team answer from the Blackboard, ending
        in FINAL ANSWER: <letter>, or for an open-ended case the sectioned write-up ending in
        RECOMMENDATION:. context_policy shared_core adds the full case block; strict: question,
        options and Blackboard only.
      config:
        context_policy: shared_core
    - id: SafetyGate
      type: dc_safety_gate
      description: >-
        Layer-4 safety gates on the answer: A_SAD (step precedence rules), T_SAD (allergy class,
        contraindication, interaction with current meds), S_NAP (stub, always passes). A failing answer
        is regenerated by the Synthesizer up to max_rollbacks times, then labelled for manual review.
        Emits GATE: PASS|BLOCKED.
      config:
        max_rollbacks: 1
    - id: Report
      type: template
      description: >-
        Final report - gate verdict and per-gate results first, then the answer (FINAL ANSWER line) or,
        for an open-ended case, the assessment and plan (RECOMMENDATION line).
      config:
        template: |-
          {%- set marker, _, body = input.partition('\n') -%}
          {%- set answer, _, gates = body.rpartition('\n\nSafety gates:\n') -%}
          DynaClinic report ({{ marker }})

          Safety gates:
          {{ gates }}

          {% if answer.startswith('Assessment and plan:\n') %}{{ answer }}{% else %}Answer:
          {{ answer }}{% endif %}
    - id: TriageDataGenerator
      type: agent
      config:
        name: ${MODEL_NAME}
        provider: openai
        role: |
          Generate a JSON array of 3 patients in triage:
          [
            {"name": "Alice Johnson", "priority": "high", "wait_time": 5},
            {"name": "Bob Williams", "priority": "medium", "wait_time": 20},
            {"name": "Carol Davis", "priority": "low", "wait_time": 45}
          ]
          Output ONLY valid JSON. Vary the patient data for each request.
        base_url: ${OPENAI_BASE_URL}
        api_key: ${OPENAI_API_KEY}
        params: {}
        tooling: null
        thinking: null
        memories: []
        retry: null
      description: Generates triage queue data
      context_window: 0
      log_output: true
    - id: TriageReport
      type: agent
      config:
        name: ${MODEL_NAME}
        provider: openai
        role: You received a triage status report. Acknowledge it briefly.
        base_url: ${OPENAI_BASE_URL}
        api_key: ${OPENAI_API_KEY}
        params: {}
        tooling: null
        thinking: null
        memories: []
        retry: null
      description: Processes triage report
      context_window: 0
      log_output: true
    - id: DailySummary
      type: agent
      config:
        name: ${MODEL_NAME}
        provider: openai
        role: |
          You received the hospital report for one simulation day: the admitted patient's presentation (JSON),
          the DynaClinic consult report on that patient, and the triage queue status.

          Write the day's summary in exactly this form, plain text, one line each:
          Day <N, from the "Day N:" prefix>
          Patient: <name>, <age>, <sex>, <chief complaint>
          DynaClinic mode: <MODE from the consult's "Meta-Controller:" line> (C <value>, U <value>)
          Leading diagnosis: <the leading diagnosis of the consult's assessment>
          Plan: <one sentence summarising the consult's plan and recommendation>
          Safety gate: <PASS or BLOCKED, from "DynaClinic report (GATE: ...)">
          Triage: <one sentence on the queue>
          Governance: <copy the "Governance note:" line verbatim if the report has one, else "none">
          Take every value from the reports; never add a diagnosis or plan of your own.
        base_url: ${OPENAI_BASE_URL}
        api_key: ${OPENAI_API_KEY}
        params: {}
        tooling: null
        thinking: null
        memories:
          - name: daily_summaries
            top_k: 1
            read: false
        retry: null
      description: Creates daily summary for each round (writes to memory)
      context_window: 0
      log_output: true
    - id: FinalReport
      type: agent
      config:
        name: ${MODEL_NAME}
        provider: openai
        role: |
          You are a hospital simulation report generator. You have access to daily summaries from multiple
          simulation days stored in memory.

          Begin with the header "HOSPITAL SIMULATION - FINAL REPORT", then:
          1. Executive Summary - one or two sentences.
          2. DynaClinic consults - one line per day, in day order:
             Day <N>: <patient> | mode <MODE> | leading diagnosis: <...> | plan: <...> | gate <PASS or BLOCKED>
          3. Overall Assessment - one or two sentences, including the triage queue picture.
          Use only what the daily summaries say.
        base_url: ${OPENAI_BASE_URL}
        api_key: ${OPENAI_API_KEY}
        params: {}
        tooling: null
        thinking: null
        memories:
          - name: daily_summaries
            top_k: 100
            retrieve_stage:
              - gen
            write: false
        retry: null
      description: Generates final simulation summary from daily memory
      context_window: 0
      log_output: true
    - id: LoopGate
      type: loop_counter
      config:
        max_iterations: 2
        message: Hospital operation cycle completed - all days processed
        passthrough: true
      description: Counts simulated days; forwards days 1..N-1 back to DayStart, releases FinalReport on day N
      context_window: 0
      log_output: true
  edges:
    - from: DayStart
      to: PatientDataGenerator
      trigger: true
      condition: 'true'
      carry_data: true
      keep_message: true
      clear_context: false
      clear_kept_context: false
      process:
        type: function
        config:
          name: inject_day_and_start_shift
    # PatientDataGenerator → Triage: the presentation as a DynaClinic plain-text case
    # (dynaclinic/plaintext.py headers; "Question:" without options = open-ended case)
    - from: PatientDataGenerator
      to: Triage
      trigger: true
      condition: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process:
        type: template
        config:
          template: |-
            {%- set p = input | fromjson -%}
            {%- macro items(value) -%}{{ value if value is string else (value or []) | join('; ') }}{%- endmacro -%}
            {{ p.patient_name }}, a {{ p.age }}-year-old {{ p.sex }}, presents with {{ p.chief_complaint }}.
            {{ p.history_of_present_illness }}
            Vitals: {{ p.vitals }}
            Examination: {{ p.exam }}
            Age: {{ p.age }}
            Sex: {{ p.sex }}
            History: {{ items(p.get('history')) }}
            Medications: {{ items(p.get('medications')) }}
            Allergies: {{ items(p.get('allergies')) }}
            Labs: {{ items(p.get('labs')) }}
            Imaging: {{ items(p.get('imaging')) }}
            Question: What is the most likely diagnosis, and what is the initial management plan?
    # PatientDataGenerator → DailySummary (data only: who was admitted)
    - from: PatientDataGenerator
      to: DailySummary
      trigger: false
      condition: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process:
        type: function
        config:
          name: inject_day_and_record_admission
    # Report → DailySummary (data only: queued until TriageReport triggers,
    # then cleared after DailySummary runs, so each day sees only its own consult)
    - from: Report
      to: DailySummary
      trigger: false
      condition: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process:
        type: function
        config:
          name: inject_day_and_flag_governance
    # Report → TriageDataGenerator (trigger only; the consult text is not needed there)
    - from: Report
      to: TriageDataGenerator
      trigger: true
      condition: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process:
        type: template
        config:
          template: Consult finished. Generate today's triage queue.
    # Inlined DynaClinic consult edges (copied from dynaclinic_mvp.yaml, minus CaseInput → Triage)
    - from: Triage
      to: GeneralistSweep
    - from: GeneralistSweep
      to: PrimaryCare
      condition:
        type: function
        config:
          name: dc_mode_hierarchical
    - from: GeneralistSweep
      to: CareTeam
      condition:
        type: function
        config:
          name: dc_mode_team
    - from: PrimaryCare
      to: SafetyGate
    - from: CareTeam
      to: DivergenceGate
    - from: DivergenceGate
      to: MeshExchange
      condition:
        type: function
        config:
          name: dc_mode_collaborative
    - from: MeshExchange
      to: Synthesizer
    - from: DivergenceGate
      to: Proponent
      condition:
        type: function
        config:
          name: dc_mode_adversarial
    - from: Proponent
      to: Critic
    - from: Critic
      to: Synthesizer
    - from: Synthesizer
      to: SafetyGate
    - from: SafetyGate
      to: Report
    - from: TriageDataGenerator
      to: TriageReport
      trigger: true
      condition: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process:
        type: template
        config:
          template: |
            TRIAGE QUEUE STATUS

            {% set patients = input | fromjson %}

            Current Queue ({{ patients | length }} patients):

            {% for patient in patients %}
            {{ loop.index }}. {{ patient.name }}
               Priority: {{ patient.priority | upper }}
               Wait Time: {{ patient.wait_time }} min
               {% if patient.priority == 'high' %}
               -> ALERT: Fast-track this patient
               {% elif patient.wait_time > 30 %}
               -> WARNING: Extended wait time
               {% endif %}
            {% endfor %}
    - from: TriageReport
      to: DailySummary
      trigger: true
      condition: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process:
        type: function
        config:
          name: inject_day_to_message
    - from: DailySummary
      to: LoopGate
      trigger: true
      condition: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process:
        type: function
        config:
          name: record_discharge
    # LoopGate → DayStart (next day until the day count is reached)
    - from: LoopGate
      to: DayStart
      trigger: true
      condition:
        type: keyword
        config:
          none:
            - Hospital operation cycle completed
      carry_data: true
      keep_message: false
      clear_context: true
      clear_kept_context: true
      process:
        type: function
        config:
          name: increment_day_counter
    # LoopGate → FinalReport (exit after the last day)
    - from: LoopGate
      to: FinalReport
      trigger: true
      condition:
        type: keyword
        config:
          any:
            - Hospital operation cycle completed
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
  # blackboard, not simple: it keeps each day's summary whole (no embedder). A simple store keeps only the
  # first 500 characters of "Input: ... Output: ...", which the consult report fills before the summary.
  memory:
    - name: daily_summaries
      type: blackboard
      config:
        memory_path: "{{run_dir}}/daily_summaries.json"
    # Literal path (not {{run_dir}}): staff memory survives across separate runs; relative to the process CWD.
    - name: clinic_staff_log
      type: blackboard
      config:
        memory_path: "WareHouse/dynaclinic_hospital_staff_log.json"
  initial_instruction: ''
  start:
    - DayStart
  end:
    - FinalReport
# Agents call OpenAI (OPENAI_BASE_URL / OPENAI_API_KEY from .env); the inlined DynaClinic consult nodes
# use DYNACLINIC_MODEL / DYNACLINIC_FALLBACK_MODELS (as in dynaclinic_mvp.yaml).
vars:
  MODEL_NAME: gpt-6-luna
