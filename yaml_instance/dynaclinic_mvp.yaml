version: 0.4.0
graph:
  id: dynaclinic_mvp
  description: |
    DynaClinic MVP: dynamic architecture switching for clinical decision support.
    The task prompt is the case: any clinical scenario as free text (optionally with Age/Sex/History/
    Medications/Allergies/Labs/Imaging lines), a multiple-choice case (Question: plus options A.-E.),
    or Case JSON (vignette, question, options, optional structured meds/allergies/labs/imaging,
    unsafe_options). A case without options is open-ended: it is answered with a clinical write-up
    ending in RECOMMENDATION:, not a letter. The Meta-Controller scores Complexity C (Triage) and
    Uncertainty U (GeneralistSweep, normalised entropy of one generalist differential) and applies the
    mode rule: U > tau_u -> adversarial; else C <= tau_c -> hierarchical (Primary Care hub, which may
    consult specialist spokes); else collaborative. Team modes run the Integrated Care Team, whose
    specialists write their independent hypotheses to a shared Blackboard. If they agree (collaborative),
    the specialists form a fully connected mesh: each reads every peer's entry and posts a revised one,
    and the Consensus Builder integrates both rounds. If they diverge beyond tau, or U entered
    adversarial mode, a one-round debate runs: the Proponent argues the primary hypothesis H1, the
    Clinical Critic as Opponent attacks H1 and the alternative H2 and flags unsupported claims, and
    the Synthesizer as Mediator names the surviving hypothesis before answering. Every answer passes the
    Layer-4 safety gates before the report. Routing reads only the first-line markers ROUTE:, MODE: and GATE:
    (functions/edge/dynaclinic_conditions.py). Nodes use DYNACLINIC_MODEL and
    DYNACLINIC_FALLBACK_MODELS unless a node sets model. Research prototype on synthetic cases; not
    clinical advice.
  log_level: INFO
  is_majority_voting: false
  start:
    - CaseInput
  end:
    - Report
  nodes:
    - id: CaseInput
      type: passthrough
      description: Forwards the task prompt (the case text or Case JSON) to triage unchanged.
      config: {}
    - id: Triage
      type: dc_triage
      description: >-
        Meta-Controller, Complexity C. Ingests the case (FHIR-lite stub), asks the LLM for a complexity
        tier, scores the case deterministically, bumps an LLM LOW to MODERATE when the score reaches
        escalate_threshold (safety bias), and emits ROUTE: LOW|MODERATE|HIGH. C = max(tier level, feature
        density), with tau_c 0.5 equivalent to the tier rule.
      config: {}
    - id: GeneralistSweep
      type: dc_uncertainty
      description: >-
        Meta-Controller, Uncertainty U and mode rule. One generalist call lists a probability-weighted
        differential (top-k, or one entry per option); U is its normalised entropy. Emits
        MODE: HIERARCHICAL|COLLABORATIVE|ADVERSARIAL. tau_u per input form and per model: the model's
        calibrated row (75th percentile of U, python -m dynaclinic.eval.calibrate); a model without one
        falls back to gpt-6-luna's 0.15 multiple choice / 0.59 open-ended with a warning. Calibrated, not
        validated against outcomes. Set tau_u_mcq / tau_u_open (or tau_u for both) to pin a value.
      config:
        k: 5
    - id: PrimaryCare
      type: dc_primary_care
      description: >-
        Hierarchical mode hub. Primary Care Agent restricted to the Emanuel & Emanuel Informative model;
        it may consult up to two specialist spokes (CONSULT: <role>: <question>), each answering only its
        own question from its own slice, then answers:
        facts and risks of each option, ending in FINAL ANSWER: <letter>; for an open-ended case a
        write-up (ASSESSMENT, DIFFERENTIAL, PLAN, RED FLAGS / ESCALATE IF, MISSING INFORMATION) ending
        in RECOMMENDATION:.
      config: {}
    - id: CareTeam
      type: dc_care_team
      description: >-
        Collaborative/adversarial modes. Integrated Care Team (Imaging, Pathology/Lab, Pharmacology; two of
        them for a LOW or MODERATE tier) writes findings, an answer distribution and claims to the shared Blackboard; for
        an open-ended case a LEADING DIAGNOSIS (or ABSTAIN) and a DOMAIN RECOMMENDATION instead of a
        distribution. context_policy shared_core: each specialist reads the case summary,
        then its own modality slice; strict: its modality slice only.
      config:
        context_policy: shared_core
    - id: DivergenceGate
      type: dc_divergence_gate
      description: >-
        Conflict-aware switch. Multiple choice: MODE: ADVERSARIAL when the specialists' top-1 answers
        disagree or their mean pairwise Jensen-Shannon divergence reaches tau. Open-ended case: when
        the mean pairwise cosine distance between their leading diagnoses (text-embedding-3-small,
        hashing fallback) reaches tau_semantic (unset: the embedder's default), or fewer than two
        specialists asserted anything. Else MODE: COLLABORATIVE. Adversarial mode entered by
        uncertainty stays ADVERSARIAL; the divergence is only reported. No LLM call.
      config:
        tau: 0.25
    - id: MeshExchange
      type: dc_mesh_exchange
      description: >-
        Collaborative mode, after the Conflict Detector compared the independent round-1 hypotheses.
        Fully connected mesh: each care-team specialist reads every peer's round-1 entry (findings,
        claims, distribution or leading diagnosis), states what it adopts or disputes from each, and
        posts a revised step-2 entry to the Blackboard, concurrently. A failed reply leaves that
        specialist's round-1 entry standing. Not a 3D character (the specialists are the Care Team's).
      config: {}
    - id: Proponent
      type: dc_proponent
      description: >-
        Adversarial mode, before the Critic. H1 is the team's plurality hypothesis (option letter, or
        leading diagnosis for an open-ended case); on a tie, the generalist sweep's top differential.
        H2 is the strongest alternative: the dissenting specialist's hypothesis, else the sweep's next
        differential. The Proponent argues H1 from the case and the Blackboard, states what would
        falsify it and why H1 beats H2. Nothing to debate or a failed call: classic Critic review.
      config: {}
    - id: Critic
      type: dc_critic
      description: >-
        Adversarial mode. Clinical Critic decomposes the Blackboard into atomic claims, scores them
        with the hybrid rule/LLM-judge estimator and flags unsupported claims for the Synthesizer. In
        the same call it is the Opponent: it reads H1, H2 and the Proponent's case and lists
        counterevidence against both (logical leaps, contradicting findings or trial evidence,
        contraindications for this patient).
      config: {}
    - id: Synthesizer
      type: dc_synthesizer
      description: >-
        Consensus Builder in collaborative mode, integrating the round-1 and mesh step-2 entries into one
        unified differential; Mediator (Conflict Resolver) in adversarial mode, where it reads the
        debate transcript and the Critic's flagged claims and first states SURVIVING HYPOTHESIS:
        H1|H2|neither and why. Writes the team answer from the Blackboard, ending
        in FINAL ANSWER: <letter>, or for an open-ended case the sectioned write-up ending in
        RECOMMENDATION:. context_policy shared_core adds the full case block; strict: question,
        options and Blackboard only.
      config:
        context_policy: shared_core
    - id: SafetyGate
      type: dc_safety_gate
      description: >-
        Layer-4 safety gates on the answer: A_SAD (step precedence rules), T_SAD (allergy class,
        contraindication, interaction with current meds), S_NAP (stub, always passes). A failing answer
        is regenerated by the Synthesizer up to max_rollbacks times, then labelled for manual review.
        Emits GATE: PASS|BLOCKED.
      config:
        max_rollbacks: 1
    - id: Report
      type: template
      description: >-
        Final report - gate verdict and per-gate results first, then the answer (FINAL ANSWER line) or,
        for an open-ended case, the assessment and plan (RECOMMENDATION line).
      config:
        template: |-
          {%- set marker, _, body = input.partition('\n') -%}
          {%- set answer, _, gates = body.rpartition('\n\nSafety gates:\n') -%}
          DynaClinic report ({{ marker }})

          Safety gates:
          {{ gates }}

          {% if answer.startswith('Assessment and plan:\n') %}{{ answer }}{% else %}Answer:
          {{ answer }}{% endif %}
  edges:
    - from: CaseInput
      to: Triage
    - from: Triage
      to: GeneralistSweep
    - from: GeneralistSweep
      to: PrimaryCare
      condition:
        type: function
        config:
          name: dc_mode_hierarchical
    - from: GeneralistSweep
      to: CareTeam
      condition:
        type: function
        config:
          name: dc_mode_team
    - from: PrimaryCare
      to: SafetyGate
    - from: CareTeam
      to: DivergenceGate
    - from: DivergenceGate
      to: MeshExchange
      condition:
        type: function
        config:
          name: dc_mode_collaborative
    - from: MeshExchange
      to: Synthesizer
    - from: DivergenceGate
      to: Proponent
      condition:
        type: function
        config:
          name: dc_mode_adversarial
    - from: Proponent
      to: Critic
    - from: Critic
      to: Synthesizer
    - from: Synthesizer
      to: SafetyGate
    - from: SafetyGate
      to: Report
  demo_scenarios:
    - id: low-leg-redness
      title: "Mock case: 34-year-old man with a warm, red lower leg"
      teaches: "Low complexity: the Meta-Controller usually keeps one Primary Care Agent; no care team is called."
      text: |
        Mock case: 34-year-old man with a warm, red lower leg

        A 34-year-old man presents with 2 days of a spreading, warm, tender, erythematous area on his left lower leg after a minor scrape while gardening. There is no fluctuance or purulent drainage, and bedside ultrasound shows no fluid collection. Temperature is 37.4 C, heart rate 82/min, and blood pressure 128/78 mm Hg. He has no medical history and takes no medications. He developed a rash after taking a sulfonamide antibiotic in the past. White blood cell count is 9,800/mm3.

        Age: 34
        Sex: male
        History: none
        Medications: none
        Allergies: sulfonamide antibiotics (rash)
        Labs: white blood cell count 9.8 x10^3/uL
        Imaging: Bedside soft-tissue ultrasound: subcutaneous edema, no fluid collection

        Question: Which of the following is the most appropriate treatment?
        A. Oral cephalexin for 5 days
        B. Oral trimethoprim-sulfamethoxazole for 7 days
        C. Hospital admission for intravenous vancomycin
        D. Incision and drainage of the affected area
        E. Topical mupirocin alone
    - id: moderate-atrial-fibrillation
      title: "Mock case: 72-year-old woman with newly found atrial fibrillation"
      teaches: "Moderate complexity: triage usually consults two specialists who share the Blackboard; they usually agree, so the Synthesizer answers without the Critic."
      text: |
        Mock case: 72-year-old woman with newly found atrial fibrillation

        A 72-year-old woman is found to have atrial fibrillation at a routine visit. She has hypertension and type 2 diabetes. Medications are lisinopril, metformin, and metoprolol, which was started last week and has controlled her heart rate to 78/min. Blood pressure is 132/80 mm Hg. ECG shows an irregularly irregular rhythm without P waves. Transthoracic echocardiography shows normal valves and a normal ejection fraction. eGFR is 70 mL/min/1.73 m2 and hemoglobin is 13.2 g/dL. She has no history of bleeding and no allergies.

        Age: 72
        Sex: female
        History: atrial fibrillation; hypertension; type 2 diabetes
        Medications: lisinopril 20 mg daily; metformin 1 g twice daily; metoprolol succinate 50 mg daily
        Allergies: none
        Labs: eGFR 70 mL/min/1.73 m2; hemoglobin 13.2 g/dL
        Imaging: ECG: irregularly irregular rhythm without P waves, ventricular rate 78/min; Transthoracic echocardiogram: normal valves, ejection fraction 60%

        Question: Which of the following is the most appropriate long-term therapy to prevent stroke?
        A. No antithrombotic therapy
        B. Aspirin plus clopidogrel
        C. Left atrial appendage occlusion as first-line therapy
        D. Apixaban
        E. Aspirin 81 mg daily alone
    - id: high-flank-pain
      title: "Mock case: 48-year-old man on phenelzine with severe flank pain"
      teaches: "Drug-interaction trap: meperidine and tramadol are dangerous with phenelzine (an MAOI). Triage sends it to the care team; the Clinical Critic is called only if the specialists diverge, which varies from run to run."
      text: |
        Mock case: 48-year-old man on phenelzine with severe flank pain

        A 48-year-old man with treatment-resistant major depressive disorder and hypertension presents with sudden, severe left flank pain radiating to the groin, with nausea. Medications are phenelzine 15 mg three times daily and amlodipine. He has no allergies. Temperature is 37.0 C, heart rate 96/min, and blood pressure 146/88 mm Hg. Urinalysis shows microscopic hematuria without pyuria. Serum creatinine is 0.9 mg/dL. Non-contrast CT of the abdomen and pelvis shows a 4-mm stone in the left distal ureter with mild hydronephrosis.

        Age: 48
        Sex: male
        History: treatment-resistant major depressive disorder; hypertension
        Medications: phenelzine 15 mg three times daily; amlodipine 10 mg daily
        Allergies: none
        Labs: serum creatinine 0.9 mg/dL; urinalysis: microscopic hematuria, no pyuria
        Imaging: Non-contrast CT abdomen and pelvis: 4-mm left distal ureteral stone, mild hydronephrosis

        Question: Which of the following is the most appropriate analgesic?
        A. Emergency ureteroscopy before any analgesia
        B. Intravenous meperidine
        C. Oral tramadol
        D. Intravenous ketorolac
        E. Intravenous fluid bolus of 3 L as the only treatment
    - id: contested-fall-on-apixaban
      title: "Mock case: 74-year-old woman on apixaban, short of breath after a fall"
      teaches: "High complexity, specialists usually agree: the full care team writes to the Blackboard and the Synthesizer answers without the Critic."
      text: |
        Mock case: 74-year-old woman on apixaban, short of breath after a fall

        A 74-year-old woman with atrial fibrillation on apixaban 5 mg twice daily, hypertension, and chronic kidney disease (eGFR 38 mL/min/1.73m2) fell at home 6 hours ago and now has new dyspnea and pleuritic chest pain. She is alert, GCS 15, without focal deficits. Heart rate 112/min, blood pressure 104/66 mm Hg, SpO2 90% on room air. Non-contrast CT head shows a 6-mm acute left frontal subdural hematoma without midline shift. CT pulmonary angiography shows bilateral segmental pulmonary emboli with an RV/LV ratio of 1.1. Troponin is mildly elevated. Hemoglobin 11.2 g/dL, platelets 190,000/mm3.

        Age: 74
        Sex: female
        History: atrial fibrillation; hypertension; chronic kidney disease stage 3b; fall 6 hours ago
        Medications: apixaban 5 mg twice daily
        Allergies: none
        Labs: hemoglobin 11.2 g/dL; platelets 190 x10^3/uL; eGFR 38 mL/min/1.73m2; troponin I 0.09 ng/mL
        Imaging: Non-contrast CT head: 6-mm acute left frontal subdural hematoma, no midline shift; CT pulmonary angiography: bilateral segmental pulmonary emboli, RV/LV ratio 1.1

        Question: Which of the following is the most appropriate next step in management?
        A. Continue apixaban at the current dose
        B. Hold apixaban, give andexanet alfa, and place an inferior vena cava filter
        C. Start a weight-based unfractionated heparin infusion without bolus
        D. Systemic thrombolysis with alteplase
        E. Switch apixaban to warfarin with a target INR of 2 to 3
    - id: contested-pregnancy-chest-pain
      title: "Mock case: Pregnant woman at 30 weeks with chest pain and shortness of breath"
      teaches: "When triage calls this HIGH, Imaging and Pharmacology disagree and the Clinical Critic is called; when it calls MODERATE, the team usually stays collaborative. The Critic ran in 4 of 9 real runs."
      text: |
        Mock case: Pregnant woman at 30 weeks with chest pain and shortness of breath

        A 29-year-old woman at 30 weeks of gestation presents with 1 day of pleuritic chest pain and dyspnea. She has mild swelling of the left calf. Heart rate 108/min, blood pressure 118/72 mm Hg, SpO2 95% on room air. Chest radiograph is normal. D-dimer is elevated. She takes prenatal vitamins only. Creatinine is 0.6 mg/dL.

        Age: 29
        Sex: female
        History: pregnancy, 30 weeks of gestation
        Medications: prenatal vitamins
        Allergies: none
        Labs: D-dimer 1.9 ug/mL FEU; creatinine 0.6 mg/dL
        Imaging: Chest radiograph: normal

        Question: Which of the following is the most appropriate next step in management?
        A. CT pulmonary angiography
        B. Ventilation-perfusion scan
        C. Start low-molecular-weight heparin and obtain compression ultrasonography of the left leg
        D. Start warfarin
        E. Reassure and discharge because D-dimer is physiologically elevated in pregnancy
    - id: contested-abdominal-pain
      title: "Mock case: 81-year-old man with severe abdominal pain and kidney disease"
      teaches: "Clinically contested (contrast risk versus a time-critical diagnosis): expect the full care team; its route has not been measured in recorded runs yet."
      text: |
        Mock case: 81-year-old man with severe abdominal pain and kidney disease

        A 81-year-old man with chronic kidney disease (eGFR 22 mL/min/1.73m2), atrial fibrillation not on anticoagulation, and heart failure presents with 5 hours of severe periumbilical abdominal pain out of proportion to a soft, mildly tender abdomen. Lactate is 4.1 mmol/L. Heart rate 118/min irregular, blood pressure 98/60 mm Hg. Plain abdominal radiograph is unremarkable. He takes furosemide and metoprolol.

        Age: 81
        Sex: male
        History: chronic kidney disease stage 4; atrial fibrillation; heart failure
        Medications: furosemide; metoprolol
        Allergies: none
        Labs: lactate 4.1 mmol/L; eGFR 22 mL/min/1.73m2
        Imaging: Plain abdominal radiograph: unremarkable

        Question: Which of the following is the most appropriate next step in management?
        A. CT angiography of the abdomen now, with intravenous fluids
        B. Non-contrast CT of the abdomen to avoid contrast nephropathy
        C. Abdominal ultrasound and serial lactate in 6 hours
        D. Start oral ibuprofen and observe
        E. Colonoscopy within 24 hours
    - id: open-covid-hypertension
      title: "Mock case: 58-year-old man with COVID-19 and high blood pressure on a sunny day"
      teaches: "Open-ended scenario (no question, no options): the reply is a structured write-up (assessment, differential, plan, red flags, missing information) ending in RECOMMENDATION, not a letter. The sunny weather is a deliberately irrelevant detail."
      text: |
        Mock case: 58-year-old man with COVID-19 and high blood pressure on a sunny day

        A 58-year-old man tested positive for COVID-19 on a home antigen test yesterday. He has had fever, dry cough, and muscle aches for 3 days and gets mildly short of breath on stairs. It is a warm, sunny day and he has spent the morning resting in the garden. Temperature 38.1 C, heart rate 96/min, blood pressure 148/90 mm Hg, SpO2 95% on room air. He has not had a COVID-19 vaccine this season.

        Age: 58
        Sex: male
        History: hypertension; hyperlipidemia
        Medications: amlodipine 10 mg daily; lisinopril 20 mg daily; simvastatin 40 mg daily
        Allergies: none
    - id: open-chest-pain-warfarin
      title: "Mock case: 79-year-old woman on warfarin with chest pressure"
      teaches: "Open-ended scenario with an anticoagulant and kidney disease: the safety gates check the free-text plan against her medication list."
      text: |
        Mock case: 79-year-old woman on warfarin with chest pressure

        A 79-year-old woman phones the clinic about 40 minutes of central chest pressure spreading to her left arm, with sweating and nausea. She takes warfarin for atrial fibrillation; her INR two weeks ago was 2.6. She asks whether she can take aspirin from her neighbour and wait to see if the pain settles.

        Age: 79
        Sex: female
        History: atrial fibrillation; type 2 diabetes; chronic kidney disease stage 3
        Medications: warfarin 5 mg daily; metformin 500 mg twice daily; bisoprolol 2.5 mg daily
        Allergies: none
        Labs: INR 2.6; eGFR 41 mL/min/1.73m2
