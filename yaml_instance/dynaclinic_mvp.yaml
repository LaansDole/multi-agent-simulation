version: 0.4.0
graph:
  id: dynaclinic_mvp
  description: |
    DynaClinic MVP: dynamic architecture switching for clinical decision support.
    The task prompt is the case: free text, or Case JSON (vignette, question, options, optional
    structured meds/allergies/labs/imaging, unsafe_options). Triage sends LOW cases to a single
    Primary Care Agent and MODERATE/HIGH cases to the Integrated Care Team, whose specialists write
    to a shared Blackboard. If their answer distributions diverge beyond tau the Clinical Critic
    reviews the claims before the Synthesizer answers (adversarial mode). Every answer passes the
    Layer-4 safety gates before the report. Routing reads only the first-line markers
    ROUTE:, MODE: and GATE: (functions/edge/dynaclinic_conditions.py). Nodes use DYNACLINIC_MODEL
    and DYNACLINIC_FALLBACK_MODELS unless a node sets model. Research prototype on synthetic cases;
    not clinical advice.
  log_level: INFO
  is_majority_voting: false
  start:
    - CaseInput
  end:
    - Report
  nodes:
    - id: CaseInput
      type: passthrough
      description: Forwards the task prompt (the case text or Case JSON) to triage unchanged.
      config: {}
    - id: Triage
      type: dc_triage
      description: >-
        Meta-Controller. Ingests the case (FHIR-lite stub), asks the LLM for a complexity tier, scores
        the case deterministically, bumps an LLM LOW to MODERATE when the score reaches
        escalate_threshold (safety bias), and emits ROUTE: LOW|MODERATE|HIGH.
      config: {}
    - id: PrimaryCare
      type: dc_primary_care
      description: >-
        LOW path. Single Primary Care Agent restricted to the Emanuel & Emanuel Informative model:
        facts and risks of each option, ending in FINAL ANSWER: <letter>.
      config: {}
    - id: CareTeam
      type: dc_care_team
      description: >-
        MODERATE/HIGH path. Integrated Care Team (Imaging, Pathology/Lab, Pharmacology; two of them
        for MODERATE) reads modality-restricted inputs and writes findings, an answer distribution
        and claims to the shared Blackboard.
      config: {}
    - id: DivergenceGate
      type: dc_divergence_gate
      description: >-
        Conflict-aware switch. Emits MODE: ADVERSARIAL when the specialists' top-1 answers disagree,
        their mean pairwise Jensen-Shannon divergence exceeds tau, or divergence cannot be measured
        (free-text case); else MODE: COLLABORATIVE. No LLM call.
      config:
        tau: 0.25
    - id: Critic
      type: dc_critic
      description: >-
        Adversarial mode. Clinical Critic decomposes the Blackboard into atomic claims, scores them
        with the hybrid rule/LLM-judge estimator and flags unsupported claims for the Synthesizer.
      config: {}
    - id: Synthesizer
      type: dc_synthesizer
      description: >-
        Writes the team answer from the Blackboard (plus the Critic's flagged claims in adversarial
        mode), ending in FINAL ANSWER: <letter>.
      config: {}
    - id: SafetyGate
      type: dc_safety_gate
      description: >-
        Layer-4 safety gates on the answer: A_SAD (step precedence rules), T_SAD (allergy class,
        contraindication, interaction with current meds), S_NAP (stub, always passes). A failing answer
        is regenerated by the Synthesizer up to max_rollbacks times, then labelled for manual review.
        Emits GATE: PASS|BLOCKED.
      config:
        max_rollbacks: 1
    - id: Report
      type: template
      description: Final report - gate verdict and per-gate results first, the answer (FINAL ANSWER line) last.
      config:
        template: |-
          {%- set marker, _, body = input.partition('\n') -%}
          {%- set answer, _, gates = body.rpartition('\n\nSafety gates:\n') -%}
          DynaClinic report ({{ marker }})

          Safety gates:
          {{ gates }}

          Answer:
          {{ answer }}
  edges:
    - from: CaseInput
      to: Triage
    - from: Triage
      to: PrimaryCare
      condition:
        type: function
        config:
          name: dc_route_low
    - from: Triage
      to: CareTeam
      condition:
        type: function
        config:
          name: dc_route_team
    - from: PrimaryCare
      to: SafetyGate
    - from: CareTeam
      to: DivergenceGate
    - from: DivergenceGate
      to: Synthesizer
      condition:
        type: function
        config:
          name: dc_mode_collaborative
    - from: DivergenceGate
      to: Critic
      condition:
        type: function
        config:
          name: dc_mode_adversarial
    - from: Critic
      to: Synthesizer
    - from: Synthesizer
      to: SafetyGate
    - from: SafetyGate
      to: Report
