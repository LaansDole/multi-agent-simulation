name: Deploy DynaClinic demo to GitHub Pages

on:
  push:
    branches: [threejs-devall, dev]
    paths:
      - "docs/dynaclinic/runbook/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site from the runbook folder
        run: |
          mkdir -p _site
          cp docs/dynaclinic/runbook/demo.html _site/index.html
          cp docs/dynaclinic/runbook/demo.html _site/demo.html
          cp docs/dynaclinic/runbook/results.html _site/results.html
          cp docs/dynaclinic/runbook/slides.html _site/slides.html
          cp docs/dynaclinic/runbook/alignment.html _site/alignment.html
          cp docs/dynaclinic/runbook/demo-hospital.html _site/demo-hospital.html
          cp docs/dynaclinic/runbook/site.css _site/site.css
          cp docs/dynaclinic/runbook/*.pdf _site/
          cp docs/dynaclinic/runbook/*.mp4 docs/dynaclinic/runbook/*.png _site/
          touch _site/.nojekyll
          ls -la _site
      - name: Check the page and its media
        run: |
          grep -q "DynamiClinic in 3D: runbook demo" _site/index.html
          test -s _site/site.css
          for f in index results alignment demo-hospital; do grep -q 'href="site.css"' "_site/$f.html"; done
          test -s _site/dynaclinic-3d-runbook-demo.mp4
          grep -q "MedQA-USMLE sample" _site/results.html
          grep -q "DynamiClinic" _site/slides.html
          grep -q "DevAll in 3D: demo_hospital" _site/demo-hospital.html
          test -s _site/demo-hospital-3d.mp4
          grep -q "reviewed proposal" _site/alignment.html
          test -s _site/dynamiclinic-slides.pdf
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "./_site"
      - id: deployment
        uses: actions/deploy-pages@v4
